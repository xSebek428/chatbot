
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buduj moda
        run: gradle build

      - name: Zapisz plik moda
        uses: actions/upload-artifact@v4
        with:
          name: BotMod
          path: build/libs/*.jar
